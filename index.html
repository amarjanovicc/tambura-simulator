<!doctype html>
<html lang="hr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f2e9d8" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400..700;1,9..144,400..600&display=swap"
      rel="stylesheet"
    />
    <meta name="description" content="Sviraj slavonski tamburaški sastav u pregledniku: prim, bas-prim, kontra i berde u srijemskom E-štimu." />
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <title>Tambura simulator</title>
  </head>
  <body>
    <div class="app">
      <header class="top">
        <div class="brand">
          <h1>Tambura</h1>
          <p class="tagline" data-i18n="tagline"></p>
        </div>
        <div class="top-actions">
          <button type="button" class="chip" id="lang-btn" aria-label="Language">EN</button>
          <button type="button" class="chip" id="help-btn" data-i18n="help">Upute</button>
        </div>
        <nav class="instruments" id="instruments" aria-label="Instrument"></nav>
      </header>

      <div class="vez" aria-hidden="true"></div>

      <p class="info" id="info"></p>

      <main class="stage">
        <canvas id="board" role="application"></canvas>
        <p class="hint" id="hint" data-i18n="tapToStart"></p>
      </main>

      <aside class="panel">
        <section class="chords" aria-labelledby="chords-label">
          <h2 class="panel-label" id="chords-label" data-i18n="chords"></h2>
          <div class="chord-row" id="chords"></div>
        </section>

        <footer class="controls">
          <div class="group band">
            <h3 class="group-label" data-i18n="bandLabel"></h3>
            <button type="button" class="play" id="band-btn" aria-pressed="false"></button>
            <p class="group-hint" data-i18n="bandHint"></p>
            <label class="toggle" id="minus-label"><input type="checkbox" id="minus" /> <span data-i18n="minusOne"></span></label>
            <p class="group-hint" data-i18n="minusOneHint"></p>
          </div>
          <div class="group">
            <h3 class="group-label" data-i18n="settings"></h3>
            <label class="toggle"><input type="checkbox" id="tremolo" /> <span data-i18n="tremolo"></span></label>
          </div>
          <button type="button" class="settings-btn" popovertarget="settings" data-i18n-label="settings">
            <svg viewBox="0 0 20 20" width="18" height="18" aria-hidden="true">
              <path d="M3 6h14M3 14h14" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" />
              <circle cx="7" cy="6" r="2.3" fill="var(--paper)" stroke="currentColor" stroke-width="1.6" />
              <circle cx="13" cy="14" r="2.3" fill="var(--paper)" stroke="currentColor" stroke-width="1.6" />
            </svg>
          </button>
          <div class="settings group" id="settings" popover>
            <h3 class="group-label" data-i18n="viewLabel"></h3>
            <label class="toggle"><input type="checkbox" id="notes" /> <span data-i18n="noteNames"></span></label>
            <label class="toggle keys-toggle"><input type="checkbox" id="keys" /> <span data-i18n="keyLabels"></span></label>
            <label class="toggle"><input type="checkbox" id="neck" /> <span data-i18n="neckOnly"></span></label>
            <label class="volume"><span data-i18n="volume"></span> <input type="range" id="volume" min="0" max="1" step="0.01" /></label>
          </div>
        </footer>
      </aside>

      <dialog id="help">
        <form method="dialog">
          <h2 data-i18n="help"></h2>
          <p data-i18n="helpIntro"></p>
          <h3 data-i18n="helpMouseTitle"></h3>
          <ul id="help-mouse"></ul>
          <h3 data-i18n="helpKeysTitle"></h3>
          <ul id="help-keys"></ul>
          <button class="chip primary" data-i18n="close"></button>
        </form>
      </dialog>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
